[pytest]
testpaths = tests
pythonpath = .
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # Raised inside starlette's TestClient (it uses an old anyio name), not by our code. Only this exact warning is
    # ignored, so any other warning still shows up.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
